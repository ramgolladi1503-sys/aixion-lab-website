<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Aixion Control Tower editorial preview</title>
<desc id="desc">Two restrained mobile approval screens resting in warm natural light.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f3ea"/><stop offset="1" stop-color="#d2cbc0"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c474c"/><stop offset="1" stop-color="#1f282d"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf8f3"/><stop offset="1" stop-color="#ebe6dd"/></linearGradient>
  <radialGradient id="light" cx="50%" cy="50%" r="50%"><stop stop-color="#fff9e7"/><stop offset="1" stop-color="#fff9e7" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1000" height="620" fill="url(#bg)"/>
<circle cx="210" cy="105" r="205" fill="url(#light)"/>
<path d="M0 448 C214 402 398 436 586 390 C752 349 888 346 1000 366 L1000 620 L0 620Z" fill="#c5bbb0" opacity=".64"/>
<ellipse cx="525" cy="522" rx="302" ry="49" fill="#5b5147" opacity=".16" filter="url(#shadow)"/>
<g transform="translate(275 92) rotate(-5 160 210)">
  <rect x="0" y="0" width="270" height="452" rx="38" fill="url(#phone)"/>
  <rect x="12" y="14" width="246" height="424" rx="30" fill="url(#screen)"/>
  <rect x="91" y="28" width="86" height="9" rx="5" fill="#c9c3b8"/>
  <text x="34" y="84" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#2b3236">Approval queue</text>
  <rect x="31" y="111" width="208" height="116" rx="12" fill="#ffffff" stroke="#d6d0c7"/>
  <text x="47" y="143" font-family="Arial,sans-serif" font-size="14" fill="#656a67">AGENT TASK</text>
  <text x="47" y="172" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2e3538">Update release config</text>
  <rect x="47" y="191" width="78" height="23" rx="11" fill="#e7e9f3"/>
  <text x="60" y="207" font-family="Arial,sans-serif" font-size="12" fill="#57649b">LOW RISK</text>
  <rect x="31" y="247" width="208" height="74" rx="12" fill="#f2eee7"/>
  <text x="47" y="277" font-family="Arial,sans-serif" font-size="15" fill="#515754">Validation required</text>
  <path d="M48 296H207" stroke="#c4bdb2"/>
  <rect x="31" y="342" width="95" height="43" rx="8" fill="#2f393e"/>
  <text x="58" y="369" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Approve</text>
  <rect x="144" y="342" width="95" height="43" rx="8" fill="#fff" stroke="#c7c0b5"/>
  <text x="174" y="369" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#3d4548">Review</text>
</g>
<g transform="translate(545 120) rotate(6 140 205)">
  <rect x="0" y="0" width="252" height="424" rx="36" fill="url(#phone)"/>
  <rect x="12" y="14" width="228" height="396" rx="28" fill="url(#screen)"/>
  <rect x="84" y="28" width="84" height="8" rx="4" fill="#c9c3b8"/>
  <text x="31" y="83" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#2b3236">Task review</text>
  <text x="31" y="119" font-family="Arial,sans-serif" font-size="13" fill="#6b706c">SCOPE</text>
  <rect x="31" y="134" width="190" height="52" rx="10" fill="#ffffff" stroke="#d5cec4"/>
  <text x="47" y="166" font-family="Arial,sans-serif" font-size="15" fill="#3c4447">Repository settings</text>
  <text x="31" y="220" font-family="Arial,sans-serif" font-size="13" fill="#6b706c">CHECKS</text>
  <circle cx="48" cy="251" r="8" fill="#7884ad"/><text x="67" y="257" font-family="Arial,sans-serif" font-size="15" fill="#3d4548">Diff reviewed</text>
  <circle cx="48" cy="286" r="8" fill="#7884ad"/><text x="67" y="292" font-family="Arial,sans-serif" font-size="15" fill="#3d4548">Validation ready</text>
  <circle cx="48" cy="321" r="8" fill="#c18b70"/><text x="67" y="327" font-family="Arial,sans-serif" font-size="15" fill="#3d4548">Human authority</text>
  <rect x="31" y="350" width="190" height="42" rx="8" fill="#6875a5"/>
  <text x="86" y="376" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Continue</text>
</g>
<path d="M50 112 L354 45" stroke="#fff" stroke-opacity=".68" stroke-width="3"/>
</svg>
