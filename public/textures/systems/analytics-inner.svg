<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#151719" />
  <text x="60" y="60" fill="#a19d99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="2">DATA TRANSFORMATION &amp; DECISION PIPELINE</text>
  <line x1="60" y1="80" x2="1140" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- 6 Step Pipeline -->
  <g transform="translate(60, 140)">
    <!-- 1 Collect -->
    <rect x="0" y="0" width="155" height="180" rx="4" fill="#1c1e22" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="32" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">01 / COLLECT</text>
    <text x="20" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Raw Ingestion</text>
    <text x="20" y="88" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Gather operational event logs and telemetry.</text>

    <!-- 2 Validate -->
    <rect x="185" y="0" width="155" height="180" rx="4" fill="#241b1f" stroke="#7A2021" stroke-width="1.5" />
    <text x="205" y="32" fill="#d49596" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">02 / VALIDATE</text>
    <text x="205" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Data Quality</text>
    <text x="205" y="88" fill="#cbb3ae" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Verify schema integrity, missing fields, outliers.</text>

    <!-- 3 Model -->
    <rect x="370" y="0" width="155" height="180" rx="4" fill="#1c1e22" stroke="rgba(255,255,255,0.08)" />
    <text x="390" y="32" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">03 / MODEL</text>
    <text x="390" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Contextualize</text>
    <text x="390" y="88" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Shape measures around the underlying question.</text>

    <!-- 4 Visualize -->
    <rect x="555" y="0" width="155" height="180" rx="4" fill="#1c1e22" stroke="rgba(255,255,255,0.08)" />
    <text x="575" y="32" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">04 / VISUALIZE</text>
    <text x="575" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Interface</text>
    <text x="575" y="88" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Present results with minimal decorative clutter.</text>

    <!-- 5 Review -->
    <rect x="740" y="0" width="155" height="180" rx="4" fill="#1c1e22" stroke="rgba(255,255,255,0.08)" />
    <text x="760" y="32" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">05 / REVIEW</text>
    <text x="760" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Evaluate</text>
    <text x="760" y="88" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Test if view actually improves judgment.</text>

    <!-- 6 Refine -->
    <rect x="925" y="0" width="155" height="180" rx="4" fill="#1c1e22" stroke="rgba(255,255,255,0.08)" />
    <text x="945" y="32" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">06 / REFINE</text>
    <text x="945" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Iterate</text>
    <text x="945" y="88" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Refine assumptions based on evidence feedback.</text>
  </g>

  <!-- Detailed Data Quality Validation Snapshot -->
  <g transform="translate(60, 400)">
    <rect width="1080" height="220" rx="6" fill="#181a1d" stroke="rgba(255,255,255,0.06)" />
    <text x="30" y="36" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1">DATA FIDELITY CHECK · BATCH AUDIT</text>

    <g transform="translate(30, 65)" font-family="monospace" font-size="12" fill="#a5a19e">
      <text x="0" y="24">[ASSERTION_1] Timestamp monotonically increasing: <tspan fill="#78998b">PASS (100.0%)</tspan></text>
      <text x="0" y="54">[ASSERTION_2] Domain boundary key presence: <tspan fill="#78998b">PASS (99.98%)</tspan></text>
      <text x="0" y="84">[ASSERTION_3] Variance outlier threshold &lt; 3.5 sigma: <tspan fill="#d49596">FLAGGED (14 records isolated)</tspan></text>
      <text x="0" y="114">[ACTION] Isolated records routed to diagnostic quarantine before presentation layer.</text>
    </g>
  </g>
</svg>