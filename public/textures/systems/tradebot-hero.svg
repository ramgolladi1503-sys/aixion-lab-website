<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="60%" stop-color="#1b171c" />
      <stop offset="100%" stop-color="#241418" />
    </linearGradient>
    <linearGradient id="burgundyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A2021" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3d1419" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3d4f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8199b0" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Atmospheric perspective glows -->
  <circle cx="1250" cy="280" r="380" fill="#7A2021" opacity="0.18" filter="blur(80px)" />
  <circle cx="350" cy="650" r="320" fill="#2d4255" opacity="0.15" filter="blur(90px)" />

  <!-- Console Framework Panels -->
  <!-- Left Panel: Market Microstructure & Order Diffusion -->
  <g transform="translate(120, 120)">
    <rect width="400" height="660" rx="6" fill="#18191c" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <line x1="0" y1="48" x2="400" y2="48" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="24" y="32" fill="#8e8986" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1.5">REGIME &amp; STRUCTURAL FLOW</text>
    <circle cx="370" cy="28" r="4" fill="#7A2021" />

    <!-- Mini chart line series -->
    <path d="M 30 180 Q 90 140 150 160 T 270 110 T 370 80" fill="none" stroke="#8199b0" stroke-width="1.5" opacity="0.7" />
    <path d="M 30 220 Q 90 260 180 210 T 300 240 T 370 190" fill="none" stroke="#7A2021" stroke-width="1.5" opacity="0.8" />
    
    <!-- Depth Ladder Simulation -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="160" height="14" fill="#7A2021" opacity="0.2" />
      <rect x="0" y="22" width="220" height="14" fill="#7A2021" opacity="0.28" />
      <rect x="0" y="44" width="130" height="14" fill="#7A2021" opacity="0.15" />
      <rect x="0" y="66" width="290" height="14" fill="#7A2021" opacity="0.35" />
      <rect x="0" y="96" width="310" height="14" fill="#2d4a3e" opacity="0.25" />
      <rect x="0" y="118" width="190" height="14" fill="#2d4a3e" opacity="0.3" />
      <rect x="0" y="140" width="240" height="14" fill="#2d4a3e" opacity="0.2" />
    </g>

    <!-- Boundary Status -->
    <g transform="translate(24, 560)">
      <rect width="352" height="64" rx="4" fill="#121314" stroke="rgba(255,255,255,0.05)" />
      <text x="16" y="26" fill="#8e8986" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">AUTHORITY BOUNDARY</text>
      <text x="16" y="48" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">HUMAN APPROVAL REQUIRED (GATE-3)</text>
      <circle cx="326" cy="32" r="5" fill="#e5b467" />
    </g>
  </g>

  <!-- Central Master Workspace: Live Execution Surface -->
  <g transform="translate(560, 120)">
    <rect width="920" height="660" rx="6" fill="#16171a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <line x1="0" y1="48" x2="920" y2="48" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text x="32" y="32" fill="#8e8986" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1.5">MARKET INTELLIGENCE TOPOLOGY · LIVE FEED [PARALLEL WEBSOCKETS]</text>
    <text x="790" y="32" fill="#7A2021" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="1">VALIDATION</text>

    <!-- Candlestick / Volatility Ribbon -->
    <g transform="translate(40, 80)">
      <!-- Price curves & uncertainty envelope -->
      <path d="M 0 340 C 120 310, 200 240, 320 270 C 440 300, 520 180, 640 160 C 740 140, 800 90, 840 70 L 840 260 C 800 280, 740 310, 640 320 C 520 330, 440 420, 320 390 C 200 360, 120 400, 0 420 Z" fill="url(#burgundyGlow)" opacity="0.25" />
      <path d="M 0 380 Q 180 340 320 310 T 640 210 T 840 120" fill="none" stroke="#d49596" stroke-width="2" />
      <path d="M 0 360 Q 180 300 320 280 T 640 180 T 840 80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4 4" />
      <path d="M 0 410 Q 180 390 320 360 T 640 260 T 840 180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4 4" />

      <!-- High-frequency tick bars -->
      <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
        <line x1="120" y1="460" x2="120" y2="420" />
        <line x1="200" y1="460" x2="200" y2="390" />
        <line x1="280" y1="460" x2="280" y2="440" />
        <line x1="360" y1="460" x2="360" y2="350" />
        <line x1="440" y1="460" x2="440" y2="310" />
        <line x1="520" y1="460" x2="520" y2="330" />
        <line x1="600" y1="460" x2="600" y2="280" />
        <line x1="680" y1="460" x2="680" y2="240" />
        <line x1="760" y1="460" x2="760" y2="220" />
      </g>
    </g>

    <!-- Bottom Metrics Row -->
    <g transform="translate(32, 580)">
      <text x="0" y="14" fill="#6c6865" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">REGIME CLASSIFIER</text>
      <text x="0" y="38" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">VOLATILITY EXPANSION / RANGE BOUND</text>

      <text x="320" y="14" fill="#6c6865" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">DATA HEALTH</text>
      <text x="320" y="38" fill="#78998b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">99.98% · 2.4MS LATENCY</text>

      <text x="600" y="14" fill="#6c6865" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">GOVERNANCE STATE</text>
      <text x="600" y="38" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">BOUNDED ADVISORY</text>
    </g>
  </g>
</svg>