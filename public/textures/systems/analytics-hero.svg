<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191b1d" />
      <stop offset="50%" stop-color="#1f2224" />
      <stop offset="100%" stop-color="#241b1d" />
    </linearGradient>
    <linearGradient id="anIvoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFDED9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EFDED9" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#anBg)" />

  <!-- Background Geometry / Soft Data Grids -->
  <g stroke="rgba(239, 222, 217, 0.08)" stroke-width="1">
    <circle cx="800" cy="450" r="350" fill="none" />
    <circle cx="800" cy="450" r="220" fill="none" />
    <line x1="800" y1="100" x2="800" y2="800" />
    <line x1="450" y1="450" x2="1150" y2="450" />
  </g>

  <!-- Editorial Chart Composition: Floating Multi-layered Workspace -->
  <g transform="translate(200, 150)">
    <rect width="1200" height="600" rx="8" fill="rgba(26,28,32,0.85)" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Top Bar -->
    <text x="40" y="44" fill="#a19d99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1.5">OPERATIONAL VISIBILITY &amp; DATA INTEGRITY LAB</text>
    <line x1="40" y1="64" x2="1160" y2="64" stroke="rgba(255,255,255,0.06)" />

    <!-- Left: Data Quality Score Matrix -->
    <g transform="translate(40, 100)">
      <text x="0" y="20" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Pipeline Ingestion Fidelity</text>
      
      <!-- Quality Bars -->
      <g transform="translate(0, 50)">
        <text x="0" y="16" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Schema Consistency</text>
        <rect x="180" y="6" width="220" height="12" rx="2" fill="rgba(255,255,255,0.05)" />
        <rect x="180" y="6" width="215" height="12" rx="2" fill="#78998b" />
        <text x="415" y="16" fill="#78998b" font-family="monospace" font-size="11">98.4%</text>

        <text x="0" y="56" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Missing Value Imputation</text>
        <rect x="180" y="46" width="220" height="12" rx="2" fill="rgba(255,255,255,0.05)" />
        <rect x="180" y="46" width="190" height="12" rx="2" fill="#c8a897" />
        <text x="415" y="56" fill="#c8a897" font-family="monospace" font-size="11">86.2%</text>

        <text x="0" y="96" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Anomaly Drift Rate</text>
        <rect x="180" y="86" width="220" height="12" rx="2" fill="rgba(255,255,255,0.05)" />
        <rect x="180" y="86" width="40" height="12" rx="2" fill="#7A2021" />
        <text x="415" y="96" fill="#d49596" font-family="monospace" font-size="11">1.8%</text>
      </g>
    </g>

    <!-- Right: Editorial Multi-series Density Chart -->
    <g transform="translate(560, 100)">
      <text x="0" y="20" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500">Distribution Shift Analysis [Pre vs Post Intervention]</text>
      
      <g transform="translate(0, 50)">
        <!-- Area 1 -->
        <path d="M 0 240 C 100 230, 180 140, 260 120 C 340 100, 420 180, 500 80 L 580 40 L 580 260 L 0 260 Z" fill="url(#anIvoryGrad)" />
        <path d="M 0 240 C 100 230, 180 140, 260 120 C 340 100, 420 180, 500 80 L 580 40" fill="none" stroke="#EFDED9" stroke-width="2" />
        
        <!-- Area 2 (Baseline) -->
        <path d="M 0 260 Q 150 200 300 190 T 580 140" fill="none" stroke="#7A2021" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- Vertical Reference Lines -->
        <line x1="260" y1="20" x2="260" y2="260" stroke="rgba(255,255,255,0.15)" stroke-dasharray="2 2" />
        <text x="268" y="40" fill="#a19d99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">REGIME SHIFT</text>
      </g>
    </g>

    <!-- Bottom KPI Strip -->
    <g transform="translate(40, 480)">
      <line x1="0" y1="0" x2="1120" y2="0" stroke="rgba(255,255,255,0.06)" />
      
      <text x="0" y="30" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">DECISION IMPACT</text>
      <text x="0" y="55" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500">+34% Operational Accuracy</text>

      <text x="400" y="30" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">EVIDENCE SOURCE</text>
      <text x="400" y="55" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500">Dual-Stage Validated Ingestion</text>

      <text x="800" y="30" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" letter-spacing="1">STATUS</text>
      <text x="800" y="55" fill="#c8a897" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500">Exploratory Prototype</text>
    </g>
  </g>
</svg>