<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="alCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#18191d" />
    </linearGradient>
    <pattern id="alCardGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#alCardBg)" />
  <rect width="800" height="500" fill="url(#alCardGrid)" />

  <circle cx="580" cy="200" r="200" fill="#7A2021" opacity="0.12" filter="blur(60px)" />
  <circle cx="180" cy="350" r="180" fill="#3b4d45" opacity="0.15" filter="blur(50px)" />

  <!-- Analytics Lab Decision Workspace -->
  <g transform="translate(60, 50)">
    <rect width="680" height="400" rx="8" fill="#17181c" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <line x1="0" y1="44" x2="680" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <text x="24" y="28" fill="#8e8986" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">ANALYTICS LAB // DATA RECONCILIATION &amp; DECISION VIEWS</text>
    <circle cx="650" cy="24" r="4" fill="#78ab92" />

    <!-- Left side: Matrix & Quality Verification -->
    <g transform="translate(24, 64)">
      <rect width="320" height="200" rx="6" fill="#131416" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="18" y="26" fill="#aaa" font-family="monospace" font-size="10">OPERATIONAL INTEGRITY MATRIX</text>
      
      <!-- Grid rows -->
      <g transform="translate(18, 44)">
        <text x="0" y="14" fill="#666" font-family="monospace" font-size="9">PIPELINE</text>
        <text x="140" y="14" fill="#666" font-family="monospace" font-size="9">DRIFT</text>
        <text x="220" y="14" fill="#666" font-family="monospace" font-size="9">CONFIDENCE</text>
        <line x1="0" y1="22" x2="280" y2="22" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

        <text x="0" y="42" fill="#ecd5d2" font-family="monospace" font-size="9.5">Stream_A</text>
        <text x="140" y="42" fill="#78ab92" font-family="monospace" font-size="9.5">&lt;0.01%</text>
        <text x="220" y="42" fill="#78ab92" font-family="monospace" font-size="9.5">99.8%</text>

        <text x="0" y="70" fill="#ecd5d2" font-family="monospace" font-size="9.5">Feature_Store</text>
        <text x="140" y="70" fill="#cf7f80" font-family="monospace" font-size="9.5">0.14%</text>
        <text x="220" y="70" fill="#cf7f80" font-family="monospace" font-size="9.5">94.2%</text>

        <text x="0" y="98" fill="#ecd5d2" font-family="monospace" font-size="9.5">Execution_Log</text>
        <text x="140" y="98" fill="#78ab92" font-family="monospace" font-size="9.5">0.00%</text>
        <text x="220" y="98" fill="#78ab92" font-family="monospace" font-size="9.5">100.0%</text>

        <text x="0" y="126" fill="#ecd5d2" font-family="monospace" font-size="9.5">Regime_Filter</text>
        <text x="140" y="126" fill="#78ab92" font-family="monospace" font-size="9.5">&lt;0.02%</text>
        <text x="220" y="126" fill="#78ab92" font-family="monospace" font-size="9.5">99.4%</text>
      </g>
    </g>

    <!-- Right side: Multi-series Cohort Chart -->
    <g transform="translate(360, 64)">
      <rect width="295" height="200" rx="6" fill="#131416" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      <text x="18" y="26" fill="#aaa" font-family="monospace" font-size="10">COHORT OBSERVABILITY</text>

      <!-- Bar distribution -->
      <g transform="translate(25, 60)">
        <rect x="0" y="80" width="22" height="40" rx="2" fill="#7A2021" opacity="0.6" />
        <rect x="35" y="50" width="22" height="70" rx="2" fill="#7A2021" opacity="0.8" />
        <rect x="70" y="20" width="22" height="100" rx="2" fill="#7A2021" />
        <rect x="105" y="40" width="22" height="80" rx="2" fill="#78ab92" opacity="0.7" />
        <rect x="140" y="30" width="22" height="90" rx="2" fill="#78ab92" opacity="0.9" />
        <rect x="175" y="60" width="22" height="60" rx="2" fill="#8199b0" opacity="0.6" />
        <rect x="210" y="90" width="22" height="30" rx="2" fill="#8199b0" opacity="0.4" />
        <line x1="0" y1="125" x2="245" y2="125" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      </g>
    </g>

    <!-- Bottom summary row -->
    <g transform="translate(24, 285)">
      <rect width="630" height="85" rx="4" fill="#121315" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
      <g transform="translate(20, 24)">
        <text x="0" y="0" fill="#666" font-family="monospace" font-size="9.5">DISCIPLINE</text>
        <text x="0" y="20" fill="#ecd5d2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Decision Support</text>
      </g>
      <g transform="translate(200, 24)">
        <text x="0" y="0" fill="#666" font-family="monospace" font-size="9.5">VALIDATION MODE</text>
        <text x="0" y="20" fill="#ecd5d2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Exploratory / Research</text>
      </g>
      <g transform="translate(420, 24)">
        <text x="0" y="0" fill="#666" font-family="monospace" font-size="9.5">DATA QUALITY</text>
        <text x="0" y="20" fill="#78ab92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Reconciled &amp; Gated</text>
      </g>
    </g>
  </g>
</svg>
