<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="ctlInnerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161719" />
      <stop offset="100%" stop-color="#101112" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#ctlInnerBg)" />

  <text x="60" y="60" fill="#a19d99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="2">CONTROL PLANE — ORCHESTRATION &amp; POLICY MAP</text>
  <line x1="60" y1="80" x2="1140" y2="80" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- 7 Stages Architecture Grid -->
  <g transform="translate(60, 130)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="130" height="180" rx="4" fill="#1d1e22" stroke="rgba(255,255,255,0.1)" />
    <text x="16" y="32" fill="#a79cb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">01 / INTAKE</text>
    <text x="16" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Task Intake</text>
    <text x="16" y="86" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Receive request, objective, or system event.</text>

    <!-- Stage 2 -->
    <rect x="155" y="0" width="130" height="180" rx="4" fill="#1d1e22" stroke="rgba(255,255,255,0.1)" />
    <text x="171" y="32" fill="#a79cb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">02 / CONTEXT</text>
    <text x="171" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Context Layer</text>
    <text x="171" y="86" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Assemble state, history, constraints &amp; evidence.</text>

    <!-- Stage 3 -->
    <rect x="310" y="0" width="130" height="180" rx="4" fill="#24191d" stroke="#7A2021" stroke-width="1.5" />
    <text x="326" y="32" fill="#d49596" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">03 / POLICY</text>
    <text x="326" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Policy Layer</text>
    <text x="326" y="86" fill="#cbb3ae" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Evaluate boundaries and allowed capabilities.</text>

    <!-- Stage 4 -->
    <rect x="465" y="0" width="130" height="180" rx="4" fill="#1d1e22" stroke="rgba(255,255,255,0.1)" />
    <text x="481" y="32" fill="#a79cb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">04 / ROUTING</text>
    <text x="481" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Routing Layer</text>
    <text x="481" y="86" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Dispatch to correct agent, service, or tool.</text>

    <!-- Stage 5 -->
    <rect x="620" y="0" width="130" height="180" rx="4" fill="#1d1e22" stroke="rgba(255,255,255,0.1)" />
    <text x="636" y="32" fill="#a79cb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">05 / EXEC</text>
    <text x="636" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Execution Layer</text>
    <text x="636" y="86" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Perform checked actions within safe sandbox.</text>

    <!-- Stage 6 -->
    <rect x="775" y="0" width="130" height="180" rx="4" fill="#1d1e22" stroke="rgba(255,255,255,0.1)" />
    <text x="791" y="32" fill="#a79cb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">06 / EVIDENCE</text>
    <text x="791" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Evidence Layer</text>
    <text x="791" y="86" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Record audit trace, decisions &amp; outputs.</text>

    <!-- Stage 7 -->
    <rect x="930" y="0" width="150" height="180" rx="4" fill="#2d1c20" stroke="#7A2021" stroke-width="2" />
    <text x="946" y="32" fill="#e5ded9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">07 / ESCALATE</text>
    <text x="946" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Human Authority</text>
    <text x="946" y="86" fill="#cbb3ae" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Escalate consequential choices for explicit approval.</text>
  </g>

  <!-- Connective Arrows -->
  <g stroke="#7A2021" stroke-width="1.5" fill="none">
    <path d="M 190 220 L 215 220" />
    <path d="M 345 220 L 370 220" />
    <path d="M 500 220 L 525 220" />
    <path d="M 655 220 L 680 220" />
    <path d="M 810 220 L 835 220" />
    <path d="M 965 220 L 990 220" />
  </g>

  <!-- Live Execution Trace Mockup Below -->
  <g transform="translate(60, 380)">
    <rect width="1080" height="240" rx="6" fill="#141518" stroke="rgba(255,255,255,0.06)" />
    <text x="30" y="36" fill="#888481" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="1">LABELLED EXECUTION TRACE PREVIEW</text>

    <g transform="translate(30, 60)" font-family="monospace" font-size="12" fill="#a5a19e">
      <text x="0" y="24"><tspan fill="#8199b0">10:42:11.021</tspan> [INTENT_ROUTER] Ingested user objective: 'Audit pull request #14 for schema anomalies'</text>
      <text x="0" y="54"><tspan fill="#a79cb8">10:42:12.190</tspan> [CONTEXT_ASSEMBLER] Bound AST diff, commit history (3 prior commits), schema definitions</text>
      <text x="0" y="84"><tspan fill="#78998b">10:42:13.402</tspan> [POLICY_EVAL] Action 'READ_REPOSITORY' allowed. Action 'AUTO_MERGE' rejected by policy</text>
      <text x="0" y="114"><tspan fill="#d49596">10:42:14.050</tspan> [TOOL_DISPATCH] Executing ast-grep in isolated worker sandbox</text>
      <text x="0" y="144"><tspan fill="#c8a897">10:42:16.890</tspan> [EVIDENCE_RECORD] Captured structured diff report. Stored hash: 0x8f2d...41a</text>
    </g>
  </g>
</svg>