name: V5.4 CI Repair Round 5

on:
  push:
    branches: [website/radial-immersive-v1]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website/radial-immersive-v1
      - name: Apply bounded source repair
        run: python scripts/repair_v54_ci_round5.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repair if needed
        run: |
          if git diff --quiet -- frontend/main.jsx; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/main.jsx
          git commit -m 'perf: keep Home background idle between interactions'
          git push origin HEAD:website/radial-immersive-v1
