name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Install production browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit

      - name: Interaction gates — Chromium, reduced motion, WebKit
        run: npm run test:interaction

      - name: Normal-motion choreography gate
        run: npm run test:motion
