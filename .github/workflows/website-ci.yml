name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bounded-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'website/radial-immersive-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: website/radial-immersive-v1

      - name: Apply bounded idle-scheduler repair
        run: python scripts/repair_v54_ci_round6.py

      - name: Validate bounded diff
        run: git diff --check

      - name: Commit source repair if needed
        run: |
          if git diff --quiet -- frontend/main.jsx; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/main.jsx
          git commit -m 'perf: eliminate idle Home rAF loop'
          git push origin HEAD:website/radial-immersive-v1

  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Install production browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit

      - name: Interaction gates — Chromium, reduced motion, WebKit
        run: npm run test:interaction

      - name: Normal-motion choreography gate
        run: npm run test:motion
