name: Website CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify deployable static export
        shell: bash
        run: |
          set -euo pipefail
          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "MISSING_EXPORT_ARTIFACT=$1"
              exit 1
            fi
          }
          require_either() {
            if [[ ! -f "$1" && ! -f "$2" ]]; then
              echo "MISSING_EXPORT_ARTIFACT=$1 OR $2"
              exit 1
            fi
          }

          require_file out/index.html
          require_either out/systems/tradebot.html out/systems/tradebot/index.html
          require_either out/research/evidence-bound-autonomy.html out/research/evidence-bound-autonomy/index.html
          require_file out/robots.txt
          require_file out/sitemap.xml
          require_file out/manifest.webmanifest
          require_file out/icon.svg

          # Preserve the repository security-policy source contract. GitHub Pages does not consume Netlify-style _headers from the static export.
          require_file public/_headers

          if grep -R -n -i -E "publication pending|will be added|build preview" out --include='*.html'; then
            echo "PROHIBITED_PLACEHOLDER_COPY_FOUND=true"
            exit 1
          fi

          echo "STATIC_EXPORT_VERIFIED=true"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production browser and visual suite
        run: npm run visual

      - name: Upload visual review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aixion-pass1-visuals
          path: test-results/
          if-no-files-found: warn
