name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deterministic dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Install production browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit

      - name: Interaction gates — Chromium, reduced motion, WebKit
        run: xvfb-run -a npm run test:interaction

      - name: Normal-motion choreography gate
        run: xvfb-run -a npm run test:motion
