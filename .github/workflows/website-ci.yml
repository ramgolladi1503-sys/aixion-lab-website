name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout draft branch for bounded repair
        uses: actions/checkout@v4
        with:
          ref: website/radial-immersive-v1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded production repair
        working-directory: .
        run: python scripts/v4_production_repair.py

      - name: Install dependencies and generate lock
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Install production browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit

      - name: Interaction gates — Chromium, reduced motion, WebKit
        run: npm run test:interaction

      - name: Normal-motion choreography gate
        run: npm run test:motion

      - name: Commit verified bounded repair
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/main.jsx frontend/package-lock.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: close V4 production accessibility and reproducibility gaps"
          git push origin HEAD:website/radial-immersive-v1
