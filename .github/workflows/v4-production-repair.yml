name: V4 One-Time Production Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: website/radial-immersive-v1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply bounded V4 production repairs
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/main.jsx")
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'const CONTACT_EMAIL = "contact@aixionlabs.com";',
              'const CONTACT_EMAIL = "contact@aixionlab.com";',
              "contact-domain",
          )

          start = text.index("function ComputationalField")
          end = text.index("\nfunction App()", start)
          field = text[start:end]
          field = replace_once(
              field,
              "      const speed = energy * modeScale;",
              "      const speed = energy * modeScale;\n      const motionTime = reduced ? 0 : time;",
              "field-motion-time",
          )
          field = replace_once(field, "Math.sin(time * 0.0015 * speed + point.phase)", "Math.sin(motionTime * 0.0015 * speed + point.phase)", "field-x-time")
          field = replace_once(field, "Math.cos(time * 0.0012 * speed + point.phase)", "Math.cos(motionTime * 0.0012 * speed + point.phase)", "field-y-time")
          field = replace_once(field, "index * 91 + time * 0.11 * speed", "index * 91 + motionTime * 0.11 * speed", "field-streak-y")
          field = replace_once(field, "index * 173 + time * 0.24 * speed", "index * 173 + motionTime * 0.24 * speed", "field-streak-x")
          field = replace_once(field, "      frame = requestAnimationFrame(draw);\n    };", "      if (!reduced) frame = requestAnimationFrame(draw);\n    };", "field-loop")
          field = replace_once(
              field,
              '    window.addEventListener("pointermove", move, { passive: true });\n    frame = requestAnimationFrame(draw);',
              '    if (!reduced) window.addEventListener("pointermove", move, { passive: true });\n    if (reduced) draw(0);\n    else frame = requestAnimationFrame(draw);',
              "field-start",
          )
          text = text[:start] + field + text[end:]

          start = text.index("function DeepSpace")
          end = text.index("\ncreateRoot", start)
          deep = text[start:end]
          deep = replace_once(
              deep,
              '    const nodes = wordsRef.current.filter(Boolean);\n    const timeline = gsap.timeline({ repeat: -1, repeatDelay: 0.08 });',
              '    const nodes = wordsRef.current.filter(Boolean);\n    if (reduced) {\n      gsap.set(nodes, { opacity: 0, z: 0, scale: 1, filter: "none" });\n      const finalNode = nodes[nodes.length - 1];\n      if (finalNode) gsap.set(finalNode, { opacity: 1 });\n      return () => gsap.set(nodes, { clearProps: "all" });\n    }\n    const timeline = gsap.timeline({ repeat: -1, repeatDelay: 0.08 });',
              "deep-reduced-static",
          )
          deep = replace_once(deep, "    if (reduced) timeline.timeScale(1.8);\n", "", "deep-remove-speedup")
          deep = replace_once(deep, "      const speed = reduced ? 10 : 27 + Math.sin(time * 0.0017) * 5;", "      const speed = reduced ? 0 : 27 + Math.sin(time * 0.0017) * 5;", "deep-star-speed")
          old_draw = '''        context.strokeStyle = star.red ? `rgba(255,55,70,${Math.min(0.94, alpha + 0.25)})` : `rgba(236,244,255,${Math.min(0.78, alpha)})`;
        context.lineWidth = star.red ? 1.45 : 0.78;
        context.beginPath();
        context.moveTo(previousX, previousY);
        context.lineTo(x, y);
        context.stroke();'''
          new_draw = '''        if (reduced) {
          context.fillStyle = star.red ? `rgba(255,55,70,${Math.min(0.94, alpha + 0.25)})` : `rgba(236,244,255,${Math.min(0.78, alpha)})`;
          const size = star.red ? 1.6 : 1;
          context.fillRect(x, y, size, size);
        } else {
          context.strokeStyle = star.red ? `rgba(255,55,70,${Math.min(0.94, alpha + 0.25)})` : `rgba(236,244,255,${Math.min(0.78, alpha)})`;
          context.lineWidth = star.red ? 1.45 : 0.78;
          context.beginPath();
          context.moveTo(previousX, previousY);
          context.lineTo(x, y);
          context.stroke();
        }'''
          deep = replace_once(deep, old_draw, new_draw, "deep-static-stars")
          deep = replace_once(deep, "      frame = requestAnimationFrame(draw);\n    };", "      if (!reduced) frame = requestAnimationFrame(draw);\n    };", "deep-loop")
          deep = replace_once(deep, "    frame = requestAnimationFrame(draw);", "    if (reduced) draw(0);\n    else frame = requestAnimationFrame(draw);", "deep-start")
          text = text[:start] + deep + text[end:]

          path.write_text(text)

      - name: Generate deterministic package lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify build
        working-directory: frontend
        run: npm install && npm run build

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/main.jsx frontend/package-lock.json
          git diff --cached --check
          git commit -m "fix: close V4 production accessibility and reproducibility gaps"
          git push origin HEAD:website/radial-immersive-v1
